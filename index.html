<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>인터랙티브 ToDo 리스트</title>
  <link rel="stylesheet" href="style.css"> <!-- 외부 CSS 파일(style.css) 연결 -->
</head>
<body>
  <h1>나의 ToDo 리스트</h1>
  <div class="input-area">
    <input type="text" id="todo-input" placeholder="할 일을 입력하세요"> <!-- 할 일 입력창 -->
    <button id="add-btn">추가</button> <!-- 할 일 추가 버튼 -->
  </div>
  <ul id="todo-list"></ul> <!-- 할 일 목록이 표시 -->

  <script src="script.js"></script> <!-- 외부 자바스크립트 파일(script.js) 연결 -->
</body>
</html>
